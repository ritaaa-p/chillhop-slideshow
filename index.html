
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
  }

  .slideshow {
    position: relative;
    width: 100%;
    height: 100%;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 24px;
    z-index: 2;
  }

  .prev { left: 12px; }
  .next { right: 12px; }

  .arrow:hover {
    background: rgba(0,0,0,0.65);
  }

  .dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    cursor: pointer;
  }

  .dot.active {
    background: white;
  }
</style>
</head>

<body>
<div class="slideshow">
  <video id="video" autoplay muted loop playsinline></video>

  <button class="arrow prev" onclick="changeSlide(-1)">&#8249;</button>
  <button class="arrow next" onclick="changeSlide(1)">&#8250;</button>

  <div class="dots" id="dots"></div>
</div>

<script>
  const videos = [
    "video-1.mp4",
    "video-2.mp4",
    "video-3.mp4"
  ];

  let current = 0;
  const player = document.getElementById("video");
  const dots = document.getElementById("dots");

  function showSlide(index) {
    current = (index + videos.length) % videos.length;
    player.src = videos[current];
    player.load();
    player.play().catch(() => {});
    updateDots();
  }

  function changeSlide(direction) {
    showSlide(current + direction);
  }

  function updateDots() {
    dots.innerHTML = "";
    videos.forEach((_, index) => {
      const dot = document.createElement("span");
      dot.className = "dot" + (index === current ? " active" : "");
      dot.onclick = () => showSlide(index);
      dots.appendChild(dot);
    });
  }

  showSlide(0);
</script>
</body>
</html>
