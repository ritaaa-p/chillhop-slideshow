
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }
  </style>
</head>
<body>
  <video id="slideshow" autoplay muted playsinline preload="metadata"></video>

  <script>
    const videos = [
      "video-1.mp4",
      "video-2.mp4",
      "video-3.mp4"
    ];

    const player = document.getElementById("slideshow");
    let current = 0;

    function playVideo() {
      player.src = videos[current];
      player.load();
      player.play().catch(() => {});
    }

    player.addEventListener("ended", () => {
      current = (current + 1) % videos.length;
      playVideo();
    });

    playVideo();
  </script>
</body>
</html>
