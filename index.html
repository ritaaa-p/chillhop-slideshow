<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent} .slider{position:relative;width:100%;max-width:720px;margin:auto;aspect-ratio:4/5;overflow:hidden;touch-action:pan-y;background:transparent}video{display:none;width:100%;height:100%;object-fit:contain}video.active{display:block}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;background:rgba(255,255,255,.86);color:#1b1b1b;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;opacity:.85;transition:opacity .2s}.arrow:hover{opacity:1}.prev{left:12px}.next{right:12px}.arrow svg{width:19px;height:19px}@media(max-width:500px){.arrow{width:32px;height:32px}.prev{left:7px}.next{right:7px}}</style></head><body><div class="slider" aria-label="Video slideshow"><video class="active" src="video-1.mp4" muted autoplay loop playsinline preload="metadata"></video><video src="video-2.mp4" muted loop playsinline preload="none"></video><video src="video-3.mp4" muted loop playsinline preload="none"></video><button class="arrow prev" aria-label="Previous video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><button class="arrow next" aria-label="Next video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div><script>(()=>{const root=document.querySelector('.slider'),videos=[...root.querySelectorAll('video')];let index=0,start=null;function show(n){videos[index].pause();videos[index].classList.remove('active');index=(n+videos.length)%videos.length;const v=videos[index];v.classList.add('active');v.currentTime=0;v.play().catch(()=>{});}root.querySelector('.prev').addEventListener('click',()=>show(index-1));root.querySelector('.next').addEventListener('click',()=>show(index+1));root.addEventListener('touchstart',e=>{start=e.touches[0].clientX},{passive:true});root.addEventListener('touchend',e=>{if(start===null)return;const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)show(index+(d<0?1:-1));start=null},{passive:true});const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting)videos[index].play().catch(()=>{});else videos[index].pause()}},{threshold:.15});observer.observe(root);videos[0].play().catch(()=>{});})();</script></body></html>
